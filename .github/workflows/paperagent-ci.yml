name: PaperAgent CI

on:
  workflow_dispatch:
  push:
    branches:
      - v0.1
      - feat/v0.1-offline-skeleton
      - feat/v0.2-literature-retrieval-foundation
      - feat/v0.3-durable-task-api-mvp
      - feat/v0.4-review-export-mvp
      - feat/v0.5-pwa-shell-mvp
  pull_request:
    branches:
      - master
      - codex/academic-rag-p0
      - feat/v0.1-offline-skeleton
      - feat/v0.2-literature-retrieval-foundation
      - feat/v0.3-durable-task-api-mvp
      - feat/v0.4-review-export-mvp
      - feat/v0.5-pwa-shell-mvp

permissions:
  contents: read

jobs:
  offline-verification:
    name: Python ${{ matrix.python-version }} offline verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy --config-file pyproject.toml
      - name: Offline tests and coverage
        run: >-
          pytest -q
          --cov=paperagent
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
      - name: Enforce raw coverage threshold
        run: python scripts/assert_coverage_threshold.py coverage.json 90.0
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  paperclaw-integration:
    name: Required PaperClaw academic integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PaperAgent and PaperClaw academic extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install \
            'paperclaw[academic] @ git+https://github.com/ZyfNO2/PaperClaw.git@codex/academic-rag-h2-retrieval'
      - name: Run required PDF and REST integration
        run: |
          pytest -q \
            tests/academic/test_paperclaw_rest_integration.py \
            tests/academic/test_frontend_dual_repo_tracer.py \
            --junitxml=paperclaw-integration.xml
          python scripts/assert_junit_no_skips.py paperclaw-integration.xml
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperclaw-integration
          path: paperclaw-integration.xml
          if-no-files-found: error

  browser-e2e:
    name: Browser academic frontend E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,browser]'
          python -m pip install \
            'paperclaw[academic] @ git+https://github.com/ZyfNO2/PaperClaw.git@codex/academic-rag-h2-retrieval'
          python -m playwright install --with-deps chromium
      - name: Run browser E2E without skips
        run: |
          pytest -q tests/browser/test_pwa_smoke.py --junitxml=browser-e2e.xml
          python scripts/assert_junit_no_skips.py browser-e2e.xml
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e
          path: browser-e2e.xml
          if-no-files-found: error
